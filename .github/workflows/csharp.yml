name: C# product

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk-version:
        description: .NET 11 SDK version to validate (exact version, e.g. 11.0.100-rc.2.26504.105)
        default: '11.0.100-rc.2.26504.105'
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  product:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: ${{ inputs.sdk-version || '11.0.100-rc.2.26504.105' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build (0 warnings 0 errors gate)
        run: dotnet build csharp/TypeScript.slnx -c Release -p:UseSharedCompilation=false
      - name: Safety suite (failure set must stay within documented baseline)
        run: node csharp/tools/run-safety-suite.mjs
      - name: Architecture gate (dependency edges and public surface budget)
        run: node csharp/tools/architecture-check.mjs
      - name: Publish NativeAOT product
        run: dotnet publish csharp/src/TypeScript.CommandLine/TypeScript.CommandLine.csproj -c Release -r win-x64 -p:PublishAot=true -p:TypeScriptExecutableName=tsc -p:EmbedTypeScriptLibraries=false -p:UseSharedCompilation=false -o built/ci-aot
      - name: Smoke test product
        run: |
          $libs = (Get-ChildItem built/ci-aot -Filter *.d.ts).Count
          if ($libs -ne 108) { throw "expected 108 bundled lib d.ts files, found $libs" }
          built/ci-aot/tsc.exe --version
          $work = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "smoke")
          Set-Content -Path (Join-Path $work.FullName "bad.ts") -Value 'const x: number = "s";'
          $output = built/ci-aot/tsc.exe (Join-Path $work.FullName "bad.ts") 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $output -notmatch "TS2322") { throw "diagnostics smoke failed" }
          # runner 会在 pwsh 脚本末尾追加 `exit $LASTEXITCODE`。tsc 对含诊断的文件按设计返回非 0，
          # 断言全过后若不显式 exit 0，步骤就死在这个注入行上：日志只剩 Version 一行，不带任何报错。
          exit 0
